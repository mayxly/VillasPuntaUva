name: Sync Airbnb Availability

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Sync availability from Airbnb
        env:
          AIRBNB_ICAL_VILLA_MARIPOSA: ${{ secrets.AIRBNB_ICAL_VILLA_MARIPOSA }}
          AIRBNB_ICAL_VILLA_TUCAN: ${{ secrets.AIRBNB_ICAL_VILLA_TUCAN }}
          AIRBNB_ICAL_VILLA_PRESIDENTE: ${{ secrets.AIRBNB_ICAL_VILLA_PRESIDENTE }}
          AIRBNB_ICAL_VILLA_COLIBRI: ${{ secrets.AIRBNB_ICAL_VILLA_COLIBRI }}
          AIRBNB_ICAL_VILLA_ANGEL: ${{ secrets.AIRBNB_ICAL_VILLA_ANGEL }}
          AIRBNB_ICAL_VILLA_CACHA: ${{ secrets.AIRBNB_ICAL_VILLA_CACHA }}
          AIRBNB_ICAL_CAREY_HOUSE: ${{ secrets.AIRBNB_ICAL_CAREY_HOUSE }}
        run: npm run sync-availability

      - name: Commit updated availability data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/airbnbAvailability.json
          git diff --cached --quiet || git commit -m "chore: sync Airbnb availability"
          git push
