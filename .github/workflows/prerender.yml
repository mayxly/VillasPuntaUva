name: Prerender for AI/Search Crawlers

# Vercel's own build (`vite build`) does not run Playwright, since Chromium
# has been unreliable to install on Vercel's build image. Instead, this
# workflow builds the site and runs scripts/prerender.mjs on a GitHub-hosted
# runner (where `playwright install --with-deps` works reliably), then
# commits only the generated index.html snapshots into prerendered/. The
# "build" script in package.json copies prerendered/ on top of dist/ after
# `vite build`, so Vercel ships these snapshots without ever touching a
# browser itself.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/data/airbnbAvailability.json'
      - 'index.html'
      - 'public/**'
      - 'scripts/prerender.mjs'
      - 'package.json'
  # Re-run after each Airbnb sync so prerendered pages reflect current
  # availability, without re-running on every unrelated code push twice.
  workflow_run:
    workflows: ['Sync Airbnb Availability']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npx vite build

      - name: Prerender routes
        run: node scripts/prerender.mjs

      - name: Sync prerendered HTML into prerendered/
        run: rsync -a --delete --prune-empty-dirs --include='*/' --include='index.html' --exclude='*' dist/ prerendered/

      - name: Commit prerendered HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prerendered/
          git diff --cached --quiet || git commit -m "chore: refresh prerendered HTML for crawlers"
          git push
